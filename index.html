function chips(){const c=$('#chips');c.textContent='';TOOLS.filter(t=>t.g==tab).forEach(t=>{const b=E('button','chip');b.append(E('span','ci',IC[t.id]),E('span','',t.n));b.type='button';b.style.order=ORD.indexOf(t.id)<0?20:ORD.indexOf(t.id);b.setAttribute('aria-pressed',t==tool);b.onclick=()=>sel(t);c.append(b)});const mo=E('button','chip more');mo.type='button';mo.style.order=99;mo.append(E('span','ci','⋯'),E('span','','More'));mo.onclick=dwOpen;c.append(mo);document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t==tab));document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t==tab))}
function sel(t,keep){if(busy)return;items.flat().forEach(x=>x&&URL.revokeObjectURL(x.url));items=t.s.map(()=>[]);tool=t;tab=t.g;resClear();chips();draw();if(!keep)history.replaceState(null,'','#'+t.id+'-'+t.g)}
function resClear(){const r=$('#res');r.hidden=true;r.textContent='';if(resURL){URL.revokeObjectURL(resURL);resURL=null}}
async function start(){if(busy)return;busy=true;cancelled=false;resClear();const run=$('#run'),cn=$('#cancel');run.disabled=true;cn.hidden=false;$('#bar').hidden=false;setP(0);$('#dt').hidden=true;const fsn=[];let out='';NOTE='';
 try{const o={};tool.f.forEach(f=>{const i=$('#o_'+f.k);o[f.k]=f.t=='chk'?i.checked:i.value});st('Loading the conversion engine (first time only, about 32 MB)…');const f=await engine();const c={o,in:[],ext:[],dur:[],probe:probe,note:m=>{NOTE=m;st(m)}};
  for(let si=0;si<tool.s.length;si++){c.in[si]=[];c.ext[si]=[];c.dur[si]=[];for(let k=0;k<items[si].length;k++){const it=items[si][k],ext=(it.file.name.match(/\.([a-z0-9]{1,5})$/i)||[0,'bin'])[1].toLowerCase(),n='in'+si+'_'+k+'.'+ext;st('Reading '+it.file.name+'…');await f.writeFile(n,new Uint8Array(await it.file.arrayBuffer()));fsn.push(n);c.in[si].push(n);c.ext[si].push(ext);c.dur[si].push(it.d)}}
  const plan=await tool.run(c);out='out.'+plan.ext;fsn.push(out);LOGS.length=0;setP(0);st('Processing… keep this tab open. Long videos can take a while.');const code=await f.exec(['-y','-hide_banner',...plan.args,out]);if(cancelled)throw Error('Cancelled.');if(code!==0)throw Error('The conversion failed. The file may be damaged or use an unsupported codec.');
  const data=await f.readFile(out);if(!data||!data.length)throw Error('The conversion produced an empty file.');const blob=new Blob([data],{type:MIME[plan.ext]||'application/octet-stream'}),base=items[0][0].file.name.replace(/\.[^.]+$/,'').replace(/[^\w\- .()]+/g,'_').slice(0,80),fn=base+'-'+tool.suf+'.'+plan.ext;resURL=URL.createObjectURL(blob);setP(1);
  const r=$('#res');r.hidden=false;r.append(E('h2','','✅ Done'));const kind=plan.ext=='gif'?'img':/^(mp3|wav|aac|flac|ogg|m4a)$/.test(plan.ext)?'audio':'video';let pv=null;if(kind=='img'){pv=E('img');pv.alt='Result preview'}else{pv=E(kind);pv.controls=true;pv.setAttribute('playsinline','');if(!pv.canPlayType(MIME[plan.ext]))pv=null}if(pv){pv.src=resURL;r.append(pv)}else r.append(E('p','','This browser cannot preview '+plan.ext.toUpperCase()+', but you can download and play it.'));
  const inSz=items[0].reduce((a,x)=>a+x.file.size,0);r.append(E('p','',fn+' · '+sz(blob.size)+(plan.cmp?' · '+(blob.size<inSz?'saved '+Math.round(100-blob.size/inSz*100)+'%':'not smaller than the original, try a stronger setting'):'')));const a=E('a','btn','⬇ Download');a.href=resURL;a.download=fn;const dv=E('div','go');dv.append(a);r.append(dv);st('Finished.'+(NOTE?' '+NOTE:''),'ok');r.scrollIntoView({behavior:'smooth',block:'nearest'})}
 catch(e){const m=cancelled||/terminate/i.test(e.message)?'Cancelled.':e.message||'Something went wrong.';st(m,m=='Cancelled.'?'':'er');if(m!='Cancelled.'&&LOGS.length){const d=$('#dt');d.hidden=false;d.querySelector('pre').textContent=LOGS.slice(-25).join('\n')}}
 finally{if(ff)for(const n of fsn)try{await ff.deleteFile(n)}catch(e){}busy=false;const r=$('#run');if(r)r.disabled=tool.s.some((s,i)=>(items[i]||[]).length<(s.m?2:1));const cn=$('#cancel');if(cn)cn.hidden=true;setTimeout(()=>{const b=$('#bar');if(b&&!busy)b.hidden=true},1500)}}
